services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pushsidian
      POSTGRES_PASSWORD: pushsidian
      POSTGRES_DB: pushsidian
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: pushsidian
      MINIO_ROOT_PASSWORD: pushsidian123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
